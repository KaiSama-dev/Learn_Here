<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buttons</title>
    <link rel="stylesheet" href="./CSS/index.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
</head>
<body>
    <main>
        <h1 class="heading">CSS Buttons</h1>
        <div class="box">
            <button class="btn-blue btn">
                Click Me 
            </button>
            <button class="btn-pink btn">
                Click Me 
            </button>
        </div>
        <div class="box">
            <button class="btn-blue-outline btn">
                Click Me 
            </button>
            <button class="btn-pink-outline btn">
                Click Me 
            </button>
        </div>
        <div class="mb-20px">
            <button class="btn-blue btn rounded">
                Click Me 
            </button>
            <button class="btn-pink btn rounded-pill">
                Click Me 
            </button>
        </div>
        <div class="box">
            <button class="btn-blue-outline btn rounded-pill">
                Click Me 
            </button>
            <button class="btn-pink-outline btn rounded">
                Click Me 
            </button>
        </div>
        <div class="box">
            <a href="#" class="btn-blue btn">
                Link Btn
            </a>
            <a href="#" class="btn-pink-outline btn">
                Link Btn
            </a>
        </div>
        <div class="box">
            <button class="btn-blue circle">
                <span class="material-symbols-outlined">
                    add
                </span>
            </button>
        </div>
    </main>
</body>
</html>
