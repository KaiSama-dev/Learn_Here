<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS list</title>
    <link rel="stylesheet" href="../CSS/index.css">
    <style>
        body{
            height: 3000px;
        }
    </style>
</head>
<body>
    <main>
        <section>
            <h1 class="heading">
                CSS List
            </h1>
            <ul class="list rounded mb-20px">
                <li class="list-item text-start">apple</li>
                <li class="list-item text-start">Orange</li>
                <li class="list-item text-start">Mango</li>
                <li class="list-item text-start">Banana</li>
            </ul>
            <ul class="list rounded mb-20px">
                <li class="list-item text-center">apple</li>
                <li class="list-item text-center">Orange</li>
                <li class="list-item text-center">Mango</li>
                <li class="list-item text-center">Banana</li>
            </ul>
            <ul class="list rounded mb-20px list-hover">
                <li class="list-item text-end">apple</li>
                <li class="list-item text-end">Orange</li>
                <li class="list-item text-end">Mango</li>
                <li class="list-item text-end">Banana</li>
            </ul>
        </section>
        <section>
            <h1 class="heading">CSS Menu</h1>
            <div class="menu mb-20px">
                <a href="#" class="menu-item">Google</a>
                <a href="#" class="menu-item">YouTube</a>
                <a href="#" class="menu-item">Facebook</a>
                <a href="#" class="menu-item">Mail</a>
            </div>
            <div class="menu mb-20px menu-h">
                <a href="#" class="menu-item">Google</a>
                <a href="#" class="menu-item">YouTube</a>
                <a href="#" class="menu-item">Facebook</a>
                <a href="#" class="menu-item">Mail</a>
            </div>
        </section>
    </main>
</body>
</html>
