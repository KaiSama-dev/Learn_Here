<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
</head>
<body>
    <h1>Unordered list</h1>

    <ul>
        <li>Apple</li>
        <li>orange</li>
        <li>mango</li>
        <li>banana</li>
    </ul>


    <h1>Ordered List</h1>
    <ol>
        <li>Apple</li>
        <li>orange</li>
        <li>mango</li>
        <li>banana</li>
    </ol>
</body>
</html>
